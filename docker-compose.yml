version: '3.8'

services:
  ros2_tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: simple_object_track:jazzy
    container_name: ros2_object_tracker
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/root/.Xauthority:rw
    devices:
      - "/dev/video0:/dev/video0"
      - "/dev/video1:/dev/video1"
    stdin_open: true
    tty: true
    command: bash
